<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AW 통합 화면 에디터</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="gnb">
  <strong class="brand">AW 통합 화면 에디터</strong>
  <span class="scope" id="scope">
    <button data-scope="all" class="on">전체</button>
    <button data-scope="shared_select">1+2편 선택</button>
    <button data-scope="part1">1편</button>
    <button data-scope="part2">2편</button>
  </span>
  <input id="q" type="search" placeholder="화면 검색…">
  <span class="grow"></span>
  <span id="state" class="state"></span>
  <button id="download" title="현재 빌드된 .gba 다운로드">⬇ ROM</button>
  <button id="apply" title="저장된 편집을 전체 재빌드로 ROM 반영">적용(빌드)</button>
</header>

<main>
  <!-- 좌측 LNB: scope 필터(GNB) + 게임순 scene 목록(아코디언 → 포함 항목) -->
  <aside id="lnb">
    <div id="coverage" class="coverage"></div>
    <div id="scenelist"></div>
  </aside>
  <!-- 우측 메인: 선택 항목 편집 화면 -->
  <section id="main">
    <div id="editor" class="editor">
      <div class="empty">왼쪽에서 화면을 펼쳐 편집할 항목(대사·스프라이트)을 선택하세요.</div>
    </div>
  </section>
</main>

<!-- 미리보기/비교 모달 -->
<div id="modal" hidden>
  <div class="modalbox">
    <div class="modalhead"><strong id="modalTitle">미리보기 — 원본 ↔ 편집</strong>
      <span id="modalInfo"></span><button id="modalClose">✕</button></div>
    <div class="modalgrid" id="modalGrid"></div>
    <div class="modalfoot">
      <span id="modalNote" class="note"></span>
      <button id="modalApply">적용(빌드)</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
