<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AW 스프라이트 픽셀 에디터</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <strong>AW 스프라이트 픽셀 에디터</strong>
  <select id="type"><option value="">전체 타입</option></select>
  <input id="q" type="search" placeholder="id/offset/source 검색…">
  <label><input type="checkbox" id="curated"> curated만</label>
  <span id="status"></span>
</header>
<main>
  <section id="list"></section>
  <section id="editor">
    <div id="toolbar">
      <span id="info">스프라이트를 선택하세요</span>
      <span class="sp"></span>
      <button id="zoomout">−</button><span id="zoomlbl">12×</span><button id="zoomin">+</button>
      <label><input type="checkbox" id="grid" checked> 격자</label>
      <button id="save" disabled>저장</button>
      <button id="revert" disabled>되돌리기</button>
      <button id="compare" disabled>원본↔적용 비교</button>
    </div>
    <div id="canvaswrap"><canvas id="cv"></canvas></div>
  </section>
  <aside id="palette">
    <div class="ttl">실기 팔레트 (색 지정)</div>
    <select id="palpick"><option value="">— 실기 팔레트 선택 —</option></select>
    <button id="palfix" disabled title="이 팔레트를 이 스프라이트에 고정 저장">고정</button>
    <div class="hint">스프라이트 타일엔 색 정보가 없어 기본은 회색입니다. 실기 캡처 팔레트(OBJ 권장)를 골라 색을 입히세요. 화면이 맞으면 ‘고정’으로 저장.</div>
    <div class="ttl">팔레트 (4bpp · 16색)</div>
    <div id="swatches"></div>
    <div class="hint">스와치 클릭=선택, 더블클릭=색변경. 현재 색 <span id="selidx">0</span></div>
  </aside>
</main>
<div id="cmpModal" hidden>
  <div class="cmpbox">
    <div class="cmphead"><strong>원본 ↔ 적용 비교</strong><span id="cmpInfo"></span><button id="cmpClose">✕</button></div>
    <div class="cmpgrid">
      <figure><figcaption>원본 (일본판 ROM)</figcaption><img id="cmpOrig" alt="원본"></figure>
      <figure><figcaption>적용 (한글 빌드 ROM)</figcaption><img id="cmpPatched" alt="적용"></figure>
      <figure id="cmpEditFig" hidden><figcaption>편집중 (미저장/저장 편집)</figcaption><img id="cmpEdit" alt="편집"></figure>
    </div>
    <div id="cmpNote" class="cmpnote"></div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
